<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Tambola Mockup</title><link rel="stylesheet" href="assets/style.css"></head>
<body data-page="login" data-bare>
<main class="narrow">
  <div class="card mt">
    <div class="center"><div class="bigicon">🎯</div><h2 style="margin-top:8px">Sign in to Tambola</h2></div>
    <p class="sub center">Use the domain, user ID and password you registered with.</p>
    <form onsubmit="return false">
      <label>Domain</label><select><option>— choose —</option><option>KEYWORDSINTL</option></select>
      <label>User ID</label><input autocomplete="username" maxlength="64">
      <label>Password</label><input type="password" autocomplete="current-password">
      <div class="alert bad">Invalid domain, user ID or password.</div>
      <div class="row mt"><a class="btn primary" href="index.html">Sign in</a><a class="btn" href="register.html">New here? Register</a></div>
    </form>
  </div>
</main>
<script src="assets/shell.js"></script>
</body></html>
