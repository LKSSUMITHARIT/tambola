<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password - Tambola Mockup</title><link rel="stylesheet" href="assets/style.css"></head>
<body data-page="password">
<main class="narrow">
  <div class="card mt">
    <div class="center"><div class="bigicon">🔒</div><h2 style="margin-top:8px">Change password</h2></div>
    <div class="alert">An administrator reset your password. Please choose a new one to continue.</div>
    <form onsubmit="return false">
      <label>Temporary password</label><input type="password">
      <label>New password</label><input type="password"><div class="hint">At least 8 characters.</div>
      <label>Confirm new password</label><input type="password">
      <div class="row mt"><a class="btn primary" href="index.html">Change password</a></div>
    </form>
  </div>
</main>
<script src="assets/shell.js"></script>
</body></html>
