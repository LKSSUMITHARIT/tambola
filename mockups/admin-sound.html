<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Settings - Tambola Mockup</title><link rel="stylesheet" href="assets/style.css"></head>
<body data-page="admin-sound">
<main>
  <section class="hero"><div class="ico">🔊</div><div class="txt"><h1>Sound <span>settings</span></h1><p>Applies to everyone (hosts and players) in every room.</p></div>
    <div class="actions"><a class="btn" href="admin-hosts.html">Hosts</a><a class="btn" href="admin-reports.html">Reports</a><a class="btn primary" href="admin-sound.html">Sound</a></div></section>
  <div class="alert info mt">Saved. Open rooms pick the new settings up within a few seconds.</div>
  <form class="card" style="max-width:860px" onsubmit="return false">
    <div class="setting"><label>Number announcements<small>Default state when a page opens</small></label><select><option>On</option><option>Off</option></select></div>
    <div class="setting"><label>Caller voice<small>Funny Hindi plays the recorded clips below</small></label><select><option>Funny Hindi (recorded clips)</option><option>Classic (browser voice, English)</option></select></div>
    <div class="setting"><label>If a clip is missing<small>Used only for numbers without a clip</small></label><select><option>Browser Hindi voice reads the joke</option><option>Classic English caller</option></select></div>
    <div class="setting"><label>Volume<small id="v">80%</small></label><input type="range" min="0" max="100" value="80" oninput="document.getElementById('v').textContent=this.value+'%'"></div>
    <div class="setting"><label>Players can mute on their device<small>Local only; does not change anything for others</small></label><select><option>Yes</option><option>No</option></select></div>
    <div class="row mt"><button class="btn primary" type="button">Save settings</button></div>
  </form>
  <div class="card mt" style="max-width:860px"><h2>Caller clips <span class="badge warn">88 / 90</span></h2>
    <p class="hint">Tap a number to hear its clip. Numbers in red have no clip and use the fallback voice.</p>
    <div class="clips" id="clips"></div></div>
</main>
<script src="assets/shell.js"></script>
<script>var s='';for(var n=1;n<=90;n++)s+='<button type="button"'+((n===13||n===77)?' class="miss"':'')+'>'+n+'</button>';document.getElementById('clips').innerHTML=s;</script>
</body></html>
