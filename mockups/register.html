<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Tambola Mockup</title><link rel="stylesheet" href="assets/style.css"></head>
<body data-page="register" data-bare>
<main class="narrow">
  <div class="card mt">
    <div class="center"><div class="bigicon">👋</div><h2 style="margin-top:8px">Welcome to Tambola</h2></div>
    <p class="sub center">Create your account. This is a one-time step.</p>
    <form onsubmit="return false">
      <label>Domain</label><select><option>— choose —</option><option>KEYWORDSINTL</option></select>
      <label>User ID</label><input autocomplete="username" maxlength="64"><div class="hint">Letters, digits, '.', '_' and '-'. This is how you sign in.</div>
      <label>Password</label><input type="password"><div class="hint">At least 8 characters.</div>
      <label>Confirm password</label><input type="password">
      <label>Display name</label><input maxlength="60">
      <label>Employee Code</label><input placeholder="e.g. EMP10234" maxlength="20"><div class="hint">One Employee Code can be linked to one email only.</div>
      <label>Email</label><input type="email" placeholder="name@company.com">
      <div class="row mt"><a class="btn primary" href="index.html">Register</a><a class="btn" href="login.html">Already registered? Sign in</a></div>
    </form>
  </div>
</main>
<script src="assets/shell.js"></script>
</body></html>
